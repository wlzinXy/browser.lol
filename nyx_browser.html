
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--color-background-tertiary)}
#browser{display:flex;flex-direction:column;height:600px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
#titlebar{background:var(--color-background-secondary);padding:8px 12px 0;display:flex;flex-direction:column;gap:6px}
#tabs-row{display:flex;align-items:center;gap:4px}
.tab{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px 6px 0 0;font-size:12px;cursor:pointer;max-width:140px;min-width:80px;background:transparent;border:0.5px solid transparent;color:var(--color-text-secondary);transition:background .15s;white-space:nowrap;overflow:hidden}
.tab.active{background:var(--color-background-primary);border-color:var(--color-border-tertiary);border-bottom-color:var(--color-background-primary);color:var(--color-text-primary)}
.tab:not(.active):hover{background:var(--color-background-tertiary)}
.tab-title{flex:1;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.tab-favicon{font-size:11px;flex-shrink:0}
.tab-close{font-size:12px;opacity:.5;flex-shrink:0;padding:0 2px;cursor:pointer;line-height:1;border:none;background:none;color:inherit}
.tab-close:hover{opacity:1}
#new-tab-btn{width:24px;height:24px;border:0.5px solid var(--color-border-tertiary);border-radius:4px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);font-size:16px;flex-shrink:0}
#new-tab-btn:hover{background:var(--color-background-tertiary)}
#nav-row{display:flex;align-items:center;gap:6px;padding:0 0 8px}
.nav-btn{width:28px;height:28px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);font-size:14px;flex-shrink:0}
.nav-btn:hover:not(:disabled){background:var(--color-background-tertiary);color:var(--color-text-primary)}
.nav-btn:disabled{opacity:.3;cursor:default}
#url-bar-wrap{flex:1;position:relative;display:flex;align-items:center}
#url-bar{width:100%;height:28px;border:0.5px solid var(--color-border-secondary);border-radius:20px;padding:0 32px 0 30px;font-size:12px;background:var(--color-background-tertiary);color:var(--color-text-primary);outline:none}
#url-bar:focus{border-color:var(--color-border-primary);background:var(--color-background-primary)}
#url-icon{position:absolute;left:9px;font-size:13px;color:var(--color-text-tertiary);pointer-events:none}
#url-go{position:absolute;right:6px;font-size:12px;color:var(--color-text-tertiary);background:none;border:none;cursor:pointer;padding:2px}
#url-go:hover{color:var(--color-text-primary)}
#content{flex:1;position:relative;background:#fff}
#content iframe{width:100%;height:100%;border:none;display:block}
#new-tab-page{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--color-background-primary);padding:24px}
#new-tab-page h2{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.quick-links{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:400px}
.quick-link{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-primary);text-decoration:none;font-size:11px;transition:background .15s}
.quick-link:hover{background:var(--color-background-tertiary)}
.quick-link i{font-size:22px;color:var(--color-text-secondary)}
#status-bar{height:18px;background:var(--color-background-secondary);border-top:0.5px solid var(--color-border-tertiary);padding:0 10px;display:flex;align-items:center;gap:8px}
#status-text{font-size:10px;color:var(--color-text-tertiary);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#loading-bar{height:2px;background:var(--color-background-tertiary);position:relative;overflow:hidden;margin:0;display:none}
#loading-fill{height:100%;background:#5c6bc0;width:0%;transition:width .3s;border-radius:1px}
#search-bar-input{width:100%;max-width:340px;height:36px;border:0.5px solid var(--color-border-secondary);border-radius:20px;padding:0 16px;font-size:13px;background:var(--color-background-tertiary);color:var(--color-text-primary);outline:none}
#search-bar-input:focus{border-color:var(--color-border-primary)}
</style>

<h2 class="sr-only">Nyx Browser — navegador interno funcional com abas</h2>
<div id="browser">
  <div id="titlebar">
    <div id="tabs-row">
      <div id="tabs-container" style="display:flex;gap:2px;flex:1;overflow-x:auto;overflow-y:visible"></div>
      <button id="new-tab-btn" title="Nova aba"><i class="ti ti-plus" aria-hidden="true"></i></button>
    </div>
    <div id="loading-bar"><div id="loading-fill"></div></div>
    <div id="nav-row">
      <button class="nav-btn" id="btn-back" title="Voltar" disabled><i class="ti ti-arrow-left" aria-hidden="true"></i></button>
      <button class="nav-btn" id="btn-fwd" title="Avançar" disabled><i class="ti ti-arrow-right" aria-hidden="true"></i></button>
      <button class="nav-btn" id="btn-reload" title="Recarregar"><i class="ti ti-refresh" aria-hidden="true"></i></button>
      <button class="nav-btn" id="btn-home" title="Início"><i class="ti ti-home" aria-hidden="true"></i></button>
      <div id="url-bar-wrap">
        <i class="ti ti-lock" id="url-icon" aria-hidden="true"></i>
        <input id="url-bar" type="text" placeholder="Digite uma URL ou pesquise no Google..." spellcheck="false" autocomplete="off"/>
        <button id="url-go" title="Ir"><i class="ti ti-arrow-right" aria-hidden="true"></i></button>
      </div>
      <button class="nav-btn" id="btn-ext" title="Abrir externo"><i class="ti ti-external-link" aria-hidden="true"></i></button>
    </div>
  </div>
  <div id="content"></div>
  <div id="status-bar">
    <span id="status-text">Pronto</span>
    <span style="font-size:10px;color:var(--color-text-tertiary)">Nyx Browser</span>
  </div>
</div>

<script>
const PROXY = 'https://api.allorigins.win/raw?url=';
const content = document.getElementById('content');
const urlBar = document.getElementById('url-bar');
const statusText = document.getElementById('status-text');
const loadingBar = document.getElementById('loading-bar');
const loadingFill = document.getElementById('loading-fill');
const tabsContainer = document.getElementById('tabs-container');
const btnBack = document.getElementById('btn-back');
const btnFwd = document.getElementById('btn-fwd');
const btnReload = document.getElementById('btn-reload');
const btnHome = document.getElementById('btn-home');
const urlIcon = document.getElementById('url-icon');

let tabs = [];
let activeTabId = null;
let tabCounter = 0;

const QUICK_LINKS = [
  {label:'Google', url:'https://www.google.com', icon:'ti-brand-google'},
  {label:'YouTube', url:'https://www.youtube.com', icon:'ti-brand-youtube'},
  {label:'Wikipedia', url:'https://pt.wikipedia.org', icon:'ti-book'},
  {label:'GitHub', url:'https://github.com', icon:'ti-brand-github'},
];

function createNewTabPage(){
  const div = document.createElement('div');
  div.id = 'new-tab-page';
  div.innerHTML = `
    <h2>Nova aba</h2>
    <input id="search-bar-input" type="text" placeholder="Pesquisar no Google ou digitar URL..."/>
    <div class="quick-links">
      ${QUICK_LINKS.map(q=>`<a class="quick-link" data-url="${q.url}"><i class="ti ${q.icon}" aria-hidden="true"></i>${q.label}</a>`).join('')}
    </div>
  `;
  div.querySelector('#search-bar-input').addEventListener('keydown', e=>{
    if(e.key==='Enter'){navigateTo(e.target.value);}
  });
  div.querySelectorAll('.quick-link').forEach(a=>{
    a.addEventListener('click',()=>navigateTo(a.dataset.url));
  });
  return div;
}

function createTab(url='newtab', title='Nova aba'){
  const id = ++tabCounter;
  const history = [];
  const tab = {id, url:'newtab', title:'Nova aba', history:[], histIdx:-1, iframe:null};
  tabs.push(tab);
  renderTabs();
  switchTab(id);
  if(url !== 'newtab') navigateTo(url);
  return id;
}

function getActiveTab(){return tabs.find(t=>t.id===activeTabId);}

function switchTab(id){
  activeTabId = id;
  renderTabs();
  renderContent();
  const tab = getActiveTab();
  if(tab){
    urlBar.value = tab.url==='newtab' ? '' : tab.url;
    updateNavBtns();
  }
}

function closeTab(id){
  const idx = tabs.findIndex(t=>t.id===id);
  tabs = tabs.filter(t=>t.id!==id);
  if(tabs.length===0){createTab(); return;}
  if(activeTabId===id){
    const newIdx = Math.min(idx, tabs.length-1);
    switchTab(tabs[newIdx].id);
  } else {
    renderTabs();
  }
}

function renderTabs(){
  tabsContainer.innerHTML = '';
  tabs.forEach(tab=>{
    const el = document.createElement('div');
    el.className = 'tab' + (tab.id===activeTabId?' active':'');
    el.innerHTML = `<i class="ti ti-world tab-favicon" aria-hidden="true"></i><span class="tab-title">${escHtml(tab.title)}</span><button class="tab-close" title="Fechar aba">×</button>`;
    el.addEventListener('click', e=>{
      if(!e.target.classList.contains('tab-close')) switchTab(tab.id);
    });
    el.querySelector('.tab-close').addEventListener('click', e=>{
      e.stopPropagation(); closeTab(tab.id);
    });
    tabsContainer.appendChild(el);
  });
}

function renderContent(){
  content.innerHTML = '';
  const tab = getActiveTab();
  if(!tab) return;
  if(tab.url==='newtab'){
    content.appendChild(createNewTabPage());
    statusText.textContent='Nova aba';
    urlIcon.className='ti ti-search';
    setLoading(false);
    return;
  }
  urlIcon.className='ti ti-lock';
  if(tab.iframe){
    content.appendChild(tab.iframe);
  } else {
    const iframe = document.createElement('iframe');
    iframe.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups');
    iframe.setAttribute('referrerpolicy','no-referrer');
    tab.iframe = iframe;
    content.appendChild(iframe);
    setLoading(true);
    loadInIframe(tab, iframe);
  }
  updateNavBtns();
}

function loadInIframe(tab, iframe){
  statusText.textContent='Carregando ' + tab.url;
  animateLoading();
  iframe.onload = ()=>{
    setLoading(false);
    statusText.textContent = tab.url;
    try{ tab.title = iframe.contentDocument.title || urlToTitle(tab.url); } catch(e){ tab.title = urlToTitle(tab.url); }
    renderTabs();
  };
  iframe.onerror = ()=>{setLoading(false); statusText.textContent='Erro ao carregar';};
  iframe.src = tab.url;
}

function navigateTo(raw){
  let url = raw.trim();
  if(!url) return;
  if(url==='newtab'){url='newtab';}
  else if(!/^https?:\/\//i.test(url)){
    if(/^[\w-]+(\.[a-z]{2,})/i.test(url)) url='https://'+url;
    else url='https://www.google.com/search?q='+encodeURIComponent(url);
  }
  const tab = getActiveTab();
  if(!tab) return;
  if(tab.url !== url){
    if(tab.histIdx < tab.history.length-1) tab.history = tab.history.slice(0,tab.histIdx+1);
    if(tab.url !== 'newtab') tab.history.push(tab.url);
    tab.histIdx = tab.history.length-1;
  }
  tab.url = url;
  tab.title = urlToTitle(url);
  tab.iframe = null;
  urlBar.value = url==='newtab' ? '' : url;
  renderTabs();
  renderContent();
  updateNavBtns();
}

function goBack(){
  const tab = getActiveTab();
  if(!tab||tab.histIdx<0) return;
  const prev = tab.history[tab.histIdx];
  if(!prev) return;
  tab.history.splice(tab.histIdx,0,tab.url);
  tab.histIdx--;
  tab.url = prev;
  tab.iframe = null;
  urlBar.value = prev;
  renderContent();
  updateNavBtns();
}

function goFwd(){
  const tab = getActiveTab();
  if(!tab) return;
  if(tab.histIdx < tab.history.length-1){
    tab.histIdx++;
    tab.url = tab.history[tab.histIdx];
    tab.iframe = null;
    urlBar.value = tab.url;
    renderContent();
    updateNavBtns();
  }
}

function updateNavBtns(){
  const tab = getActiveTab();
  btnBack.disabled = !tab || tab.histIdx < 0;
  btnFwd.disabled = !tab || tab.histIdx >= tab.history.length-1;
}

function setLoading(show){
  loadingBar.style.display = show ? 'block' : 'none';
  if(!show){loadingFill.style.width='0%';}
}

function animateLoading(){
  let w=0;
  loadingFill.style.width='0%';
  const iv = setInterval(()=>{
    w += Math.random()*12;
    if(w>=85){clearInterval(iv);w=85;}
    loadingFill.style.width=w+'%';
  },120);
  setTimeout(()=>{clearInterval(iv);loadingFill.style.width='100%';setTimeout(()=>setLoading(false),200);},4000);
}

function urlToTitle(url){
  if(url==='newtab') return 'Nova aba';
  try{const u=new URL(url);return u.hostname.replace('www.','');}catch(e){return url.slice(0,20);}
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

urlBar.addEventListener('keydown', e=>{if(e.key==='Enter') navigateTo(urlBar.value);});
document.getElementById('url-go').addEventListener('click',()=>navigateTo(urlBar.value));
btnBack.addEventListener('click',goBack);
btnFwd.addEventListener('click',goFwd);
btnReload.addEventListener('click',()=>{
  const tab=getActiveTab();
  if(!tab||tab.url==='newtab') return;
  tab.iframe=null; renderContent();
});
btnHome.addEventListener('click',()=>{
  const tab=getActiveTab();
  if(!tab) return;
  tab.url='newtab'; tab.iframe=null; renderContent(); urlBar.value='';
});
document.getElementById('btn-ext').addEventListener('click',()=>{
  const tab=getActiveTab();
  if(tab&&tab.url&&tab.url!=='newtab') window.open(tab.url,'_blank');
});
document.getElementById('new-tab-btn').addEventListener('click',()=>createTab());

createTab();
</script>
